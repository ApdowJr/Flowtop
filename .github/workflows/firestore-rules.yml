name: Firestore rules

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate Firestore indexes
        run: node scripts/validate-firestore-indexes.js firestore.indexes.json
      - name: Run Firestore emulator security tests
        run: |
          set +e
          npx firebase emulators:exec --project demo-flowtop --only firestore 'node --test test/rules/*.test.js' > /tmp/rules-tests.txt 2>&1
          status=$?
          cat /tmp/rules-tests.txt
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          text = Path('/tmp/rules-tests.txt').read_text(errors='replace')[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PYCODE
          fi
          exit "$status"
