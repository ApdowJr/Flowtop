name: Android Build

on:
  push:
    branches: [main, arena/64871141-flowtop, fix/stable-google-signing-and-android-check]
  pull_request:
    branches: [main, arena/64871141-flowtop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_CONFIGURED: ${{ secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate Gradle wrapper
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            wrapper_dir="$(mktemp -d)"
            printf "plugins { id 'base' }\\n" > "$wrapper_dir/build.gradle"
            gradle -p "$wrapper_dir" wrapper --gradle-version 8.14.3 --distribution-type bin
            cp "$wrapper_dir/gradlew" android/gradlew
            cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
            chmod +x android/gradlew
          fi

      - name: Configure Google Services
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Error: GOOGLE_SERVICES_JSON secret is not set. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
          if ! python3 -m json.tool android/app/google-services.json > /dev/null 2>&1; then
            echo "Error: Decoded android/app/google-services.json is not valid JSON."
            exit 1
          fi

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: flowtop-android-debug-keystore-v1

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze > /tmp/flowtop-analysis.txt 2>&1
          status=$?
          cat /tmp/flowtop-analysis.txt
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              if [[ "$line" == *' • '* ]]; then
                echo "::error::$line"
              fi
            done < /tmp/flowtop-analysis.txt
          fi
          exit "$status"

      - name: Test authentication, dashboard and workspace UI
        run: |
          set +e
          flutter test --reporter expanded test/widget/dashboard_ui_test.dart test/widget/workspace_ui_test.dart test/widget/auth_flow_ui_test.dart test/unit/auth_provider_test.dart > /tmp/flowtop-tests.txt 2>&1
          status=$?
          cat /tmp/flowtop-tests.txt
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          text = Path('/tmp/flowtop-tests.txt').read_text(errors='replace')[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PYCODE
          fi
          exit "$status"

      - name: Build debug APK
        run: flutter build apk --debug

      # Export the exact certificate fingerprints used by this CI debug APK.
      - name: Export debug signing fingerprints
        run: |
          mkdir -p "$HOME/.android" build/app/outputs/flutter-apk
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          set -o pipefail
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -E 'SHA1:|SHA256:' \
            | tee build/app/outputs/flutter-apk/debug-signing-fingerprints.txt
          test -s build/app/outputs/flutter-apk/debug-signing-fingerprints.txt

      - name: Check Firebase OAuth configuration
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          config = json.loads(pathlib.Path("android/app/google-services.json").read_text())
          expected_project = "flowtop-e68b6"
          expected_package = "com.flowtop.app"
          if config.get("project_info", {}).get("project_id") != expected_project:
              sys.exit("ERROR: google-services.json belongs to a different Firebase project.")
          clients = config.get("client", [])
          app = next((c for c in clients if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected_package), None)
          if app is None:
              sys.exit("ERROR: google-services.json has no Android client for com.flowtop.app.")
          oauth = app.get("oauth_client", [])
          web_client = any(c.get("client_type") == 3 for c in oauth)
          android_clients = [c for c in oauth if c.get("client_type") == 1]
          text = pathlib.Path("build/app/outputs/flutter-apk/debug-signing-fingerprints.txt").read_text()
          match = re.search(r"SHA1:\s*([0-9A-F:]+)", text, re.I)
          sha1 = match.group(1).replace(":", "").lower() if match else ""
          registered = any(
              c.get("android_info", {}).get("package_name") == expected_package
              and c.get("android_info", {}).get("certificate_hash", "").lower() == sha1
              for c in android_clients
          )
          print(f"Firebase project: {expected_project} [OK]")
          print(f"Android package: {expected_package} [OK]")
          print(f"Web OAuth client present: {web_client}")
          print(f"Current APK SHA-1 registered in google-services.json: {registered}")
          if not web_client:
              print("::warning::No Web OAuth client (client_type 3) found. Google Sign-In may fail.")
          if not registered:
              print("::warning::This APK signing SHA-1 is not in google-services.json. Add the fingerprint to Firebase, download a fresh google-services.json, and update GOOGLE_SERVICES_JSON.")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flowtop-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/debug-signing-fingerprints.txt
          retention-days: 7

      # Release build is conditional on signing secrets being present.
      - name: Build release APK (if signing configured)
        if: ${{ env.RELEASE_CONFIGURED == 'true' }}
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          echo "$KEY_PROPERTIES" > android/key.properties
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > upload-keystore.jks
          flutter build apk --release

      - name: Build release AAB (if signing configured)
        if: ${{ env.RELEASE_CONFIGURED == 'true' }}
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          echo "$KEY_PROPERTIES" > android/key.properties
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > upload-keystore.jks
          flutter build appbundle --release

      - name: Upload release artifacts
        if: ${{ env.RELEASE_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flowtop-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  publish-debug-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: flowtop-debug-apk
          path: dist

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flowtop-debug-${{ github.run_number }}-${{ github.run_attempt }}
          name: FlowTop Debug APK #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Automated FlowTop debug build.
            This is a test APK, not a Play Store release.
          files: |
            dist/app-debug.apk
            dist/debug-signing-fingerprints.txt
